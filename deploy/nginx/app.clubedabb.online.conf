# Clube da BB — proxy reverso para o Nuxt/Nitro gerenciado pelo PM2.
# Instale primeiro esta versão HTTP. Depois execute o Certbot; ele adicionará
# automaticamente o bloco HTTPS e o redirecionamento de HTTP para HTTPS.
server {
    listen 80;
    listen [::]:80;

    server_name app.clubedabb.online;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
