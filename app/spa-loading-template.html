<!--
  Loader exibido antes da hidratação (o app roda com ssr: false, então a primeira
  tela leva alguns instantes). Este é o mecanismo do Nuxt 4 para isso — o antigo
  `app.html` da raiz usava sintaxe do Nuxt 2 e nunca era lido.
  Estilo inline de propósito: nenhum CSS do app carregou ainda neste ponto.
-->
<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000000;z-index:99999">
  <div style="width:50px;height:50px;border:4px solid rgba(255,20,147,.18);border-top-color:#ff1493;border-radius:50%;animation:clube-spin 1s linear infinite"></div>
</div>
<style>
  @keyframes clube-spin { to { transform: rotate(360deg) } }
</style>
